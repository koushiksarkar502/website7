<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Under Maintenance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px 30px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .gear-icon {
            font-size: 80px;
            margin-bottom: 20px;
            display: inline-block;
            animation: spin 4s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            color: #4facfe;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #dcdcdc;
            margin-bottom: 25px;
        }

        .status-badge {
            display: inline-block;
            background-color: #ff9800;
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .footer-text {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #888;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.7rem;
            }
            p {
                font-size: 0.95rem;
            }
            .gear-icon {
                font-size: 60px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="gear-icon">⚙️</div>
        <h1>We'll Be Back Soon!</h1>
        <p>Our website is currently undergoing scheduled maintenance. We are performing system updates to improve your user experience.</p>
        <div class="status-badge">Work in Progress</div>
        <p class="footer-text">Thank you for your patience!</p>
    </div>

</body>
</html>
