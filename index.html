<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Maintenance</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: #fff;
      background: #080d1a;
      overflow: hidden;
      padding: 20px;
    }

    .glow {
      position: fixed;
      width: 350px;
      height: 350px;
      background: #2563eb;
      filter: blur(150px);
      opacity: 0.25;
      border-radius: 50%;
      top: -100px;
      left: -100px;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 600px;
      padding: 45px 25px;
      text-align: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      backdrop-filter: blur(15px);
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.3);
      animation: appear 1s ease;
    }

    .icon {
      font-size: 65px;
      margin-bottom: 20px;
      display: inline-block;
      animation: float 3s ease-in-out infinite;
    }

    .tag {
      display: inline-block;
      color: #93c5fd;
      background: rgba(59, 130, 246, 0.15);
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 12px;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(30px, 6vw, 44px);
      margin-bottom: 18px;
      line-height: 1.2;
    }

    h1 span {
      color: #60a5fa;
    }

    p {
      color: #aab5c8;
      font-size: 16px;
      line-height: 1.8;
      margin-bottom: 28px;
    }

    .loader {
      width: 160px;
      height: 5px;
      background: #202b40;
      border-radius: 10px;
      margin: 0 auto 15px;
      overflow: hidden;
    }

    .loader span {
      display: block;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #2563eb, #38bdf8);
      border-radius: 10px;
      animation: loading 1.5s ease-in-out infinite;
    }

    .status {
      font-size: 13px;
      color: #8da0bc;
      margin-bottom: 25px;
    }

    .footer {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 0;
    }

    @keyframes loading {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(260%); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .container { padding: 35px 20px; }
      p { font-size: 14px; }
    }
  </style>
</head>

<body>
  <div class="glow"></div>

  <main class="container">
    <div class="icon">🛠️</div>

    <div class="tag">WE'LL BE BACK SOON</div>

    <h1>Site Under <span>Maintenance</span></h1>

    <p>
      We're making some improvements to give you
      a better experience. Our website will be back
      online soon. Thank you for your patience!
    </p>

    <div class="loader"><span></span></div>
    <div class="status">Updating our systems...</div>

    <p class="footer">
      ; <span id=""></span> 
    </p>
  </main>

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();
  </script>
</body>
</html>
